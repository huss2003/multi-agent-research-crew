[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multi-agent-research-crew"
version = "0.1.0"
description = "Multi-agent research pipeline with a hand-written DAG orchestrator, shared evidence store, budget manager and claim verifier."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Hussain", email = "flutterflow53@gmail.com" }]
dependencies = [
  "pydantic>=2.6",
  "typer>=0.12",
  "httpx>=0.27",
  "anthropic>=0.40",
  "trafilatura>=1.12",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
crew = "crew.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["crew"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]
ignore = ["E501"]  # the formatter owns code wrapping; long prompt/regex strings are fine
